services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rigging
      POSTGRES_PASSWORD: rigging
      POSTGRES_DB: rigging
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigging -d rigging"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://rigging:rigging@db:5432/rigging
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # 清洁启动时 uvicorn 导入、建表与播种需要时间；容器 started 不代表已在监听。
    # 用健康检查把“已可服务”显式化，web 与其上的验收会等到接口真正可达再放行。
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: ./web
    environment:
      # 浏览器经 vite 代理访问 /api；Vitest 用 API_URL 直连真实接口
      API_PROXY_TARGET: http://api:8000
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
